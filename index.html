<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة النجوم: أفلان و أفلانة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0d2b;
            --neon-pink: #ff66cc;
            --neon-blue: #00e5ff;
            --star-yellow: #fff176;
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg-deep);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            font-family: 'Tajawal', sans-serif;
            color: white;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* العنوان العلوي */
        header {
            text-align: center; margin: 20px 0;
            font-size: 1.5rem; text-shadow: 0 0 10px var(--neon-blue);
        }

        /* الحاوية الرئيسية للموقع (مثل البرواز في الصورة) */
        .main-container {
            position: relative;
            width: 95%; max-width: 1000px;
            height: 85vh;
            border: 4px solid #1a237e;
            border-radius: 30px;
            background: rgba(13, 17, 51, 0.8);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            padding: 20px;
            overflow: hidden;
        }

        /* 1. الصاروخ والركاب */
        .rocket-unit {
            position: absolute; top: 50px; left: 20px;
            width: 250px; text-align: center;
            animation: float 4s infinite ease-in-out;
        }
        .rocket-img { font-size: 80px; display: block; transform: rotate(-45deg); }
        .passengers {
            background: rgba(255,255,255,0.1); padding: 5px 15px;
            border-radius: 20px; border: 1px solid var(--neon-blue);
            font-size: 0.9rem; margin-top: 10px;
        }

        /* 2. تاريخ التعارف (المربع الكبير) */
        .info-box {
            position: absolute; top: 40px; right: 40px;
            width: 280px; padding: 20px;
            border: 3px solid var(--neon-pink);
            border-radius: 20px; background: rgba(0,0,0,0.4);
            box-shadow: 0 0 20px rgba(255, 102, 204, 0.3);
            text-align: center;
        }
        .date-badge {
            background: #fff; color: #0b0d2b;
            padding: 5px 15px; border-radius: 10px;
            font-weight: bold; font-size: 1.2rem;
        }

        /* 3. خريطة الرحلة (النجوم المتصلة) */
        .journey-path {
            position: absolute; bottom: 80px; left: 50px;
            display: flex; align-items: center; gap: 15px;
        }
        .step-star {
            font-size: 1.5rem; color: var(--star-yellow);
            cursor: pointer; transition: 0.3s;
        }
        .step-star:hover { transform: scale(1.3); filter: drop-shadow(0 0 10px gold); }
        .path-line { width: 40px; height: 2px; background: dashed var(--neon-blue); opacity: 0.5; }

        /* 4. رسائل الحب (الأزرار الجانبية) */
        .side-menu {
            position: absolute; top: 220px; right: 40px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .menu-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--neon-blue);
            padding: 15px 25px; border-radius: 15px;
            cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
        }
        .menu-item:hover { background: var(--neon-blue); color: #000; }

        /* 5. استكشاف المستقبل (الكوكب) */
        .planet-future {
            position: absolute; bottom: 40px; right: 40px;
            width: 150px; height: 150px;
            background: linear-gradient(45deg, #ff5722, #ff9800);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; text-align: center;
            font-weight: bold; border: 5px solid rgba(255,255,255,0.2);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* مشغل الموسيقى (يظهر عند الضغط) */
        #music-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .player-card {
            background: var(--bg-deep); padding: 30px; border-radius: 30px;
            border: 2px solid var(--neon-blue); text-align: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-45deg); }
            50% { transform: translateY(-20px) rotate(-40deg); }
        }

        footer { margin-top: 20px; opacity: 0.8; }
    </style>
</head>
<body>

    <header>✨ ثيم رحلة النجوم: أفلان و أفلانة ✨</header>

    <div class="main-container">
        <div class="rocket-unit">
            <span class="rocket-img">🚀</span>
            <div class="passengers">خريطة الرحلة</div>
        </div>

        <div class="info-box">
            <div class="date-badge">12 / 10 / 2023</div>
            <h3>تاريخ تعارفنا</h3>
            <p style="font-size: 0.8rem;">اني ونجمي الساطع أفلانة</p>
        </div>

        <div class="side-menu">
            <div class="menu-item" onclick="alert('أنتِ كل رسائل الحب ❤️')">
                <span>📧</span> رسائل الحب
            </div>
            <div class="menu-item" onclick="openMusic()">
                <span>🔭</span> ذكرياتنا الكونية
            </div>
        </div>

        <div class="journey-path">
            <span class="step-star">⭐</span><div class="path-line"></div>
            <span class="step-star">⭐</span><div class="path-line"></div>
            <span class="step-star">⭐</span><div class="path-line"></div>
            <span class="step-star">⭐</span><div class="path-line"></div>
            <span class="step-star" style="font-size: 2rem;">🌙</span>
        </div>

        <div class="planet-future" onclick="alert('مستقبلنا معاً سيكون الأجمل ✨')">
            استكشاف<br>المستقبل
        </div>
    </div>

    <div id="music-modal" onclick="this.style.display='none'">
        <div class="player-card">
            <h2>🎵 ذكرياتنا الموسيقية</h2>
            <p>أغنيتنا المفضلة</p>
            <button onclick="toggleAudio()" style="width:60px; height:60px; border-radius:50%; border:none; background:var(--neon-pink); color:white; font-size:24px; cursor:pointer;">▶</button>
            <audio id="audio-track" loop><source src="your_song.mp3" type="audio/mpeg"></audio>
        </div>
    </div>

    <footer>🚀 رحلتنا مستمرة... للأبد ❤️</footer>

    <script>
        function openMusic() {
            document.getElementById('music-modal').style.display = 'flex';
        }

        function toggleAudio() {
            const track = document.getElementById('audio-track');
            track.paused ? track.play() : track.pause();
        }
    </script>
</body>
</html>
