<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حديقة أفلانة الموسيقية 🌸🎵</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. الأساسيات ونظام الألوان --- */
        :root {
            --p-main: #ff1262;
            --p-light: #ff6090;
            --p-dark: #7a0932;
            --glass: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
            outline: none;
        }

        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #a5d6f7 0%, #fce4ec 100%);
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
        }

        /* --- 2. الشمس والبيئة المحيطة --- */
        .ambient-sun {
            position: fixed; top: -100px; left: -100px;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,255,225,0.6) 0%, rgba(255,255,255,0) 70%);
            z-index: 1; filter: blur(30px);
            animation: sunPulse 8s infinite alternate;
        }

        @keyframes sunPulse {
            from { opacity: 0.4; transform: scale(1); }
            to { opacity: 0.8; transform: scale(1.1); }
        }

        /* --- 3. نظام الرياح والأعشاب --- */
        .meadow {
            position: fixed; bottom: 0; width: 100%; height: 120px;
            z-index: 2; pointer-events: none;
        }

        .grass {
            position: absolute; bottom: 0;
            width: 3px; background: linear-gradient(to top, #1b5e20, #4caf50);
            border-radius: 5px; transform-origin: bottom center;
            animation: windSway var(--d) infinite ease-in-out alternate;
        }

        @keyframes windSway {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(6deg); }
        }

        /* --- 4. الوردة التفاعلية --- */
        .flower-stage {
            position: relative; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.5s ease;
        }

        .stem {
            position: absolute; width: 14px; height: 320px;
            background: linear-gradient(to right, #1b5e20, #388e3c, #1b5e20);
            top: 30px; border-radius: 15px; z-index: 5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .petal {
            position: absolute; width: 130px; height: 190px;
            background: radial-gradient(ellipse at bottom left, var(--p-light), var(--p-main), var(--p-dark));
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            transform-origin: bottom center; bottom: 30px;
            cursor: pointer; z-index: 50;
            box-shadow: 2px 8px 20px rgba(0,0,0,0.3);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .flower-center {
            position: absolute; width: 85px; height: 85px;
            background: radial-gradient(circle at 30% 30%, #fff176, #fbc02d, #f57f17);
            border-radius: 50%; z-index: 100;
            box-shadow: 0 0 30px rgba(255,193,7,0.5);
        }

        /* --- 5. مشغل الأغاني الاحترافي (يظهر في النهاية) --- */
        .music-player {
            position: fixed; bottom: -400px; /* مخفي في البداية */
            width: 90%; max-width: 340px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px; padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            z-index: 3000; text-align: center;
            transition: bottom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .player-active { bottom: 40px; }

        .album-art {
            width: 100px; height: 100px;
            background: var(--p-main);
            margin: 0 auto 15px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; color: white;
            box-shadow: 0 0 20px var(--p-main);
            animation: rotateDisk 5s infinite linear;
            animation-play-state: paused;
        }

        @keyframes rotateDisk { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .player-controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        
        .play-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--p-main); color: white;
            border: none; font-size: 24px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: 0.3s;
        }

        .play-btn:hover { transform: scale(1.1); background: var(--p-dark); }

        .progress-container {
            width: 100%; height: 6px; background: rgba(0,0,0,0.1);
            margin: 20px 0; border-radius: 10px; position: relative;
        }
        .progress-bar {
            width: 0%; height: 100%; background: var(--p-main);
            border-radius: 10px; transition: width 0.1s linear;
        }

        /* --- 6. رسالة الورقة --- */
        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 4000; backdrop-filter: blur(10px);
        }

        .modal-card {
            width: 80%; max-width: 300px; padding: 40px;
            background: var(--p-main); border-radius: 40px;
            text-align: center; color: white; animation: popUp 0.5s ease;
        }

        @keyframes popUp { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }

        .btn-show-music {
            margin-top: 20px; padding: 12px 25px;
            background: white; color: var(--p-main);
            border-radius: 50px; border: none; font-weight: bold;
            cursor: pointer; display: none;
        }

        #cloud { position: fixed; bottom: 30px; right: 30px; font-size: 80px; cursor: grab; z-index: 500; }
        .hidden { opacity: 0; pointer-events: none; transform: translateY(100px) rotate(20deg) !important; }
    </style>
</head>
<body>

    <div class="ambient-sun"></div>

    <div class="music-player" id="main-player">
        <div class="album-art" id="disk">🎵</div>
        <h3 style="margin: 0; color: #333;">أغنية أفلانة ❤️</h3>
        <p style="font-size: 14px; color: #666;">لحن الحب الأبدي</p>
        
        <div class="progress-container">
            <div class="progress-bar" id="p-bar"></div>
        </div>

        <div class="player-controls">
            <button class="play-btn" id="play-pause" onclick="toggleMusic()">▶</button>
        </div>
    </div>

    <audio id="track" loop>
        <source src="your_song.mp3" type="audio/mpeg">
    </audio>

    <div id="modal">
        <div class="modal-card">
            <div id="modal-text" style="font-size: 1.5rem; font-weight: bold;"></div>
            <button class="btn-show-music" id="music-trigger" onclick="activatePlayer()">افتحي الهدية الموسيقية 🎵</button>
            <p id="close-hint" style="font-size: 12px; margin-top: 15px; opacity: 0.8;">(اضغطي هنا للإغلاق)</p>
        </div>
    </div>

    <div id="cloud">🌧</div>

    <div class="flower-stage" id="flower-target">
        <div class="stem"></div>
        <div id="petals-container"></div>
        <div class="flower-center"></div>
    </div>

    <div class="meadow" id="meadow"></div>

    <script>
        const msgs = [
            "أنتِ النور في عتمتي ❤️", "جمالكِ يغلب الورد 🌹",
            "أفلانة.. ملكة قلبي 👑", "ضحكتكِ هي لحني المفضل 🎵",
            "كل يوم معكِ هو عيد ✨", "أعشقكِ بجنون يا نجمتي 🌟",
            "أنتِ أجمل من كل الألحان ❤️"
        ];

        let plucked = 0;
        const track = document.getElementById('track');
        const playBtn = document.getElementById('play-pause');
        const pBar = document.getElementById('p-bar');
        const disk = document.getElementById('disk');

        // 1. بناء البيئة (الرياح)
        function initMeadow() {
            const m = document.getElementById('meadow');
            for(let i=0; i<80; i++) {
                const g = document.createElement('div');
                g.className = 'grass';
                g.style.left = Math.random() * 100 + '%';
                g.style.height = (Math.random() * 40 + 30) + 'px';
                g.style.setProperty('--d', (Math.random() * 2 + 2) + 's');
                g.style.animationDelay = Math.random() * 2 + 's';
                m.appendChild(g);
            }
        }

        // 2. بناء الوردة
        function createFlower() {
            const container = document.getElementById('petals-container');
            container.innerHTML = '';
            plucked = 0;
            document.getElementById('main-player').classList.remove('player-active');
            
            for (let i = 0; i < 7; i++) {
                const p = document.createElement('div');
                p.className = 'petal';
                p.style.transform = `rotate(${i * (360/7)}deg)`;
                
                p.onclick = (e) => {
                    e.stopPropagation();
                    showMsg(i, p);
                };
                container.appendChild(p);
            }
        }

        function showMsg(index, pElement) {
            const modal = document.getElementById('modal');
            const musicBtn = document.getElementById('music-trigger');
            const closeHint = document.getElementById('close-hint');

            document.getElementById('modal-text').innerText = msgs[index];
            modal.style.display = 'flex';
            pElement.classList.add('hidden');
            plucked++;

            // إذا كانت هذه آخر ورقة
            if(plucked === 7) {
                musicBtn.style.display = 'block';
                closeHint.innerText = ""; // لا تغلق تلقائياً
            } else {
                musicBtn.style.display = 'none';
                closeHint.innerText = "(اضغطي للإغلاق)";
                modal.onclick = () => modal.style.display = 'none';
            }
        }

        // 3. تفعيل المشغل
        function activatePlayer() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('main-player').classList.add('player-active');
            toggleMusic(); // تشغيل تلقائي عند الفتح
        }

        // 4. منطق الموسيقى
        function toggleMusic() {
            if(track.paused) {
                track.play();
                playBtn.innerText = "⏸";
                disk.style.animationPlayState = 'running';
            } else {
                track.pause();
                playBtn.innerText = "▶";
                disk.style.animationPlayState = 'paused';
            }
        }

        // تحديث شريط التقدم
        track.ontimeupdate = () => {
            const percent = (track.currentTime / track.duration) * 100;
            pBar.style.width = percent + "%";
        };

        // 5. السحابة والسقي
        let dragging = false;
        const cloud = document.getElementById('cloud');
        cloud.onmousedown = cloud.ontouchstart = () => dragging = true;
        window.onmouseup = window.ontouchend = () => dragging = false;
        
        window.onmousemove = window.ontouchmove = (e) => {
            if (!dragging) return;
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            cloud.style.position = 'fixed';
            cloud.style.left = (x - 40) + 'px';
            cloud.style.top = (y - 40) + 'px';
            
            const target = document.getElementById('flower-target').getBoundingClientRect();
            if (Math.abs(x - (target.left + target.width/2)) < 100 && plucked === 7) {
                createFlower();
            }
        };

        window.onload = () => { initMeadow(); createFlower(); };
    </script>
</body>
</html>
