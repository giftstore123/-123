<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عالم أفلانة السحري 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-light: #ffebf5;
            --pink-main: #ffb3d9;
            --pink-dark: #ff4d94;
            --glass: rgba(255, 255, 255, 0.8);
        }

        /* تنسيق يضمن العمل على الموبايل والتابلت والكمبيوتر */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body, html {
            height: 100%; width: 100%; overflow: hidden;
            background: linear-gradient(135deg, #fff0f5 0%, #e6f7ff 100%);
            display: flex; justify-content: center; align-items: center;
        }

        #bg-canvas { position: absolute; inset: 0; z-index: 1; }

        /* حاوية مرنة تتكيف مع كل الشاشات */
        .main-card {
            position: relative; z-index: 10;
            width: 90%; max-width: 450px; height: 85%; max-height: 750px;
            background: var(--glass); backdrop-filter: blur(15px);
            border: 4px solid white; border-radius: 40px;
            display: flex; flex-direction: column;
            padding: 20px; gap: 15px;
            box-shadow: 0 15px 35px rgba(255, 179, 217, 0.3);
        }

        .header { text-align: center; border-bottom: 2px dashed var(--pink-main); padding-bottom: 10px; }
        .header h1 { font-size: 1.3rem; color: var(--pink-dark); }

        .hero {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 10px;
        }
        .character {
            font-size: 100px; cursor: pointer; transition: 0.3s;
            filter: drop-shadow(0 10px 15px rgba(255, 77, 148, 0.2));
            animation: bounce 3s infinite ease-in-out;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .bubble {
            background: white; padding: 10px 20px; border-radius: 20px;
            color: var(--pink-dark); font-weight: 900; font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* الأزرار الثلاثة */
        .btns { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            background: white; border: 2px solid var(--pink-main);
            padding: 15px; border-radius: 20px; display: flex;
            align-items: center; gap: 15px; cursor: pointer;
            box-shadow: 0 4px 0 var(--pink-main); transition: 0.2s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .icon { font-size: 22px; min-width: 40px; height: 40px; background: var(--pink-light); border-radius: 12px; display: flex; justify-content: center; align-items: center; }
        .info h3 { font-size: 0.9rem; color: var(--pink-dark); }
        .info p { font-size: 0.7rem; color: #999; }

        /* مشغل الموسيقى */
        .player {
            background: var(--pink-dark); padding: 12px; border-radius: 25px;
            display: flex; align-items: center; gap: 15px; color: white;
        }
        .play-btn {
            background: white; border: none; width: 35px; height: 35px;
            border-radius: 50%; color: var(--pink-dark); cursor: pointer;
        }

        /* نافذة الرسائل */
        #modal {
            position: fixed; inset: 0; background: rgba(255, 179, 217, 0.8);
            z-index: 1000; display: none; justify-content: center; align-items: center;
        }
        .modal-card {
            width: 80%; max-width: 350px; background: white; padding: 25px;
            border-radius: 30px; text-align: center; border: 4px solid var(--pink-main);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-card">
        <div class="header"><h1>🌸 مملكة أفلانة 🌸</h1></div>

        <div class="hero">
            <div class="character" id="bunny">🐰</div>
            <div class="bubble" id="talk">نورتي يا روحي! ✨</div>
        </div>

        <div class="btns">
            <div class="btn" onclick="pop('الصدفة الحلوة 📅', 'في هذا التاريخ [حسب طلب الزبون]، نص رسالة ويا التاريخ حسب طلب الزبون! 💖')">
                <div class="icon">📅</div>
                <div class="info"><h3>تاريخ الصدفة</h3><p>أجمل يوم بالتقويم</p></div>
            </div>
            <div class="btn" onclick="pop('رسائل حب 💌', 'نص حسب طلب الزبون! ❤️')">
                <div class="icon">💌</div>
                <div class="info"><h3>رسائل حب وكذا</h3><p>كلام من أعماق قلبي</p></div>
            </div>
            <div class="btn" onclick="pop('وعد للأبد 💍','نص حسب طلب الزبون! 🌸')">
                <div class="icon">✨</div>
                <div class="info"><h3>وعد للأبد</h3><p>عهدي لج طول العمر</p></div>
            </div>
        </div>

        <div class="player">
            <button class="play-btn" onclick="playMusic()" id="pBtn">▶</button>
            <div style="flex:1">
                <p style="font-size:0.7rem; font-weight:bold">أغنية أفلانة 🎵</p>
                <div style="height:3px; background:rgba(255,255,255,0.3); margin-top:5px"><div id="bar" style="width:0%; height:100%; background:white"></div></div>
            </div>
        </div>
    </div>

    <div id="modal" onclick="closePop()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 id="mTitle" style="color:var(--pink-dark); margin-bottom:10px"></h2>
            <p id="mBody" style="color:#666; line-height:1.5"></p>
            <button onclick="closePop()" style="margin-top:15px; padding:8px 20px; border-radius:15px; border:none; background:var(--pink-dark); color:white; font-weight:bold">إغلاق 🌸</button>
        </div>
    </div>

    <audio id="track" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            pts = [];
            for(let i=0; i<30; i++) pts.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*15+10, v:Math.random()*1+0.5});
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 179, 217, 0.5)";
            pts.forEach(p => {
                ctx.font = p.s + "px serif";
                ctx.fillText("🌸", p.x, p.y);
                p.y += p.v;
                if(p.y > canvas.height) p.y = -20;
            });
            requestAnimationFrame(draw);
        }

        const audio = document.getElementById('track');
        function playMusic() {
            const btn = document.getElementById('pBtn');
            if(audio.paused) { audio.play(); btn.innerText = "⏸"; }
            else { audio.pause(); btn.innerText = "▶"; }
        }

        audio.ontimeupdate = () => { document.getElementById('bar').style.width = (audio.currentTime/audio.duration*100) + "%"; };

        function pop(t, b) {
            document.getElementById('mTitle').innerText = t;
            document.getElementById('mBody').innerText = b;
            document.getElementById('modal').style.display = 'flex';
        }
        function closePop() { document.getElementById('modal').style.display = 'none'; }

        document.getElementById('bunny').onclick = function() {
            this.style.transform = "scale(1.3) rotate(10deg)";
            document.getElementById('talk').innerText = "أحبج حيل! ❤️";
            setTimeout(() => { this.style.transform = "scale(1)"; }, 500);
        };

        window.onload = () => { init(); draw(); };
        window.onresize = init;
    </script>
</body>
</html>
