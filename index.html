<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردة أفلانة ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --petal-color: radial-gradient(ellipse at bottom, #ff6090, #e91e63, #ad1457);
            --bg-color: #0b0d17;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* حاوية الوردة - لضمان التمركز المطلق */
        .flower-wrapper {
            position: relative;
            width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center;
        }

        /* قلب الوردة */
        .center {
            position: absolute; width: 60px; height: 60px;
            background: radial-gradient(circle, #ffeb3b, #f57f17);
            border-radius: 50%; z-index: 20;
            box-shadow: 0 0 20px rgba(255, 202, 40, 0.6);
        }

        /* الساق */
        .stem {
            position: absolute; width: 12px; height: 250px;
            background: linear-gradient(to bottom, #1b5e20, #388e3c, #1b5e20);
            top: 40px; border-radius: 10px; z-index: 1;
        }

        /* البتلات - الضبط الجديد */
        .petal {
            position: absolute;
            width: 110px; height: 160px;
            background: var(--petal-color);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            /* التعديل الجوهري: نقطة ارتكاز الدوران في أسفل المنتصف تماماً */
            transform-origin: bottom center; 
            bottom: 30px; /* جعلها تنبت من خلف القلب */
            cursor: pointer;
            z-index: 10;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }

        /* عرض الرسالة في منتصف الشاشة */
        #petal-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(10px);
        }

        .modal-petal {
            width: 300px; height: 450px;
            background: var(--petal-color);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex; justify-content: center; align-items: center;
            padding: 30px; text-align: center; color: white;
            font-size: 1.6rem; font-weight: bold;
            box-shadow: 0 0 50px #e91e63;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* السحابة 🌧 */
        #cloud {
            position: absolute; bottom: 40px; right: 40px;
            font-size: 85px; cursor: grab; z-index: 500;
            filter: drop-shadow(0 0 10px white);
            user-select: none;
        }

        .rain {
            position: absolute; color: #4fc3f7; font-size: 25px;
            animation: rainFall 0.7s linear infinite;
            pointer-events: none; z-index: 400;
        }

        @keyframes rainFall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100px); opacity: 0; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="petal-modal" onclick="this.style.display='none'">
    <div class="modal-petal" id="modal-text"></div>
</div>

<div id="cloud">🌧</div>

<div class="flower-wrapper" id="flower-target">
    <div class="center"></div>
    <div id="petals-container"></div>
    <div class="stem"></div>
</div>

<script>
    const msgs = [
        "أنتِ النور في عتمتي ❤️",
        "جمالكِ يغلب الورد 🌹",
        "أفلانة.. ملكة قلبي 👑",
        "ضحكتكِ هي لحني المفضل 🎵",
        "كل يوم معكِ هو عيد ✨",
        "أعشقكِ بجنون يا نجمتي 🌟",
        "بُستاني لا يزهر إلا بكِ ❤️"
    ];

    let plucked = 0;
    const cloud = document.getElementById('cloud');

    function buildFlower() {
        const container = document.getElementById('petals-container');
        container.innerHTML = '';
        plucked = 0;
        for (let i = 0; i < 7; i++) {
            const p = document.createElement('div');
            p.className = 'petal';
            // توزيع الأوراق بدقة حول المركز
            const rotate = i * (360 / 7);
            p.style.transform = `rotate(${rotate}deg)`;
            
            p.onclick = () => {
                document.getElementById('modal-text').innerText = msgs[i];
                document.getElementById('petal-modal').style.display = 'flex';
                p.classList.add('hidden');
                plucked++;
            };
            container.appendChild(p);
        }
    }

    // نظام السحب للسحابة
    let isDragging = false;
    cloud.onmousedown = cloud.ontouchstart = () => isDragging = true;
    window.onmouseup = window.ontouchend = () => isDragging = false;

    window.onmousemove = window.ontouchmove = (e) => {
        if (!isDragging) return;
        const x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const y = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        
        cloud.style.left = (x - 45) + 'px';
        cloud.style.top = (y - 45) + 'px';
        cloud.style.right = 'auto'; cloud.style.bottom = 'auto';

        // تأثير المطر
        const drop = document.createElement('div');
        drop.className = 'rain'; drop.innerHTML = '💧';
        drop.style.left = x + 'px'; drop.style.top = (y + 40) + 'px';
        document.body.appendChild(drop);
        setTimeout(() => drop.remove(), 700);

        // فحص السقي
        const rect = document.getElementById('flower-target').getBoundingClientRect();
        if (Math.abs(x - (rect.left + rect.width/2)) < 80 && Math.abs(y - (rect.top + rect.height/2)) < 80) {
            if (plucked === 7) buildFlower();
        }
    };

    window.onload = buildFlower;
</script>
</body>
</html>
