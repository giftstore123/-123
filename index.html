<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مملكة أفلانة الكيوت 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;800;900&family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --main-pink: #ffb3d9;
            --dark-pink: #ff4d94;
            --soft-white: rgba(255, 255, 255, 0.85);
            --bg-gradient: linear-gradient(180deg, #fff0f5 0%, #ffe4e1 100%);
        }

        /* إعدادات الموبايل لمنع التمرير وتثبيت القياس */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            height: 100vh; width: 100vw;
            overflow: hidden; /* يمنع التمرير */
            display: flex; flex-direction: column;
            align-items: center; position: relative;
        }

        /* خلفية القلوب المتحركة */
        #heart-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }

        /* الحاوية الرئيسية للهاتف */
        .app-container {
            position: relative; z-index: 10;
            width: 90%; height: 95%;
            margin-top: 5%;
            display: flex; flex-direction: column;
            gap: 15px;
        }

        /* الهيدر الكيوت */
        .header {
            text-align: center; padding: 10px;
            background: var(--soft-white);
            border-radius: 20px;
            border: 2px solid white;
            box-shadow: 0 5px 15px rgba(255, 179, 217, 0.3);
        }

        .header h1 { font-size: 1.2rem; color: var(--dark-pink); }

        /* منطقة الأرنوب التفاعلية */
        .character-zone {
            flex-grow: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        .bunny-emoji {
            font-size: 80px;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .bubble {
            background: white; padding: 10px 20px;
            border-radius: 20px; margin-top: 10px;
            font-weight: bold; color: var(--dark-pink);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 0.9rem; position: relative;
        }

        /* أزرار الذكريات الثلاثة (على مقاس الموبايل) */
        .buttons-grid {
            display: flex; flex-direction: column;
            gap: 12px; margin-bottom: 20px;
        }

        .cute-btn {
            background: white;
            border: 2px solid var(--main-pink);
            padding: 18px; border-radius: 25px;
            display: flex; align-items: center; gap: 15px;
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0 var(--main-pink);
        }

        .cute-btn:active { transform: translateY(4px); box-shadow: none; }

        .btn-icon {
            font-size: 24px; background: #fff0f5;
            width: 45px; height: 45px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 15px;
        }

        .btn-text h3 { font-size: 1rem; color: var(--dark-pink); }
        .btn-text p { font-size: 0.7rem; color: #888; }

        /* مشغل الموسيقى البسيط */
        .music-bar {
            background: var(--dark-pink);
            padding: 12px 20px; border-radius: 25px;
            display: flex; align-items: center; gap: 15px;
            color: white; margin-bottom: 10px;
        }

        .play-pause {
            background: white; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            color: var(--dark-pink); font-size: 18px;
        }

        /* نافذة الرسائل */
        #overlay {
            position: fixed; inset: 0;
            background: rgba(255, 179, 217, 0.85);
            z-index: 1000; display: none;
            justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal {
            width: 85%; background: white;
            padding: 30px; border-radius: 35px;
            text-align: center; border: 4px solid var(--main-pink);
        }
    </style>
</head>
<body>

    <canvas id="heart-canvas"></canvas>

    <div class="app-container">
        
        <div class="header">
            <h1>🌸 مملكة أفلانة السحرية 🌸</h1>
        </div>

        <div class="character-zone">
            <div class="bunny-emoji" id="bunny">🐰</div>
            <div class="bubble" id="msg">أهلاً يا أميرتي! ✨</div>
        </div>

        <div class="buttons-grid">
            
            <div class="cute-btn" onclick="openBox('الصدفة الحلوة 📅', 'في هذا التاريخ [12/10/2023]، بدأت أجمل صدفة في حياتي، التاريخ اللي خلى دنيتي وردية بوجودج! ✨')">
                <div class="btn-icon">📅</div>
                <div class="btn-text">
                    <h3>تاريخ الصدفة الحلوة</h3>
                    <p>متى بدأت الحكاية؟</p>
                </div>
            </div>

            <div class="cute-btn" onclick="openBox('رسائل من القلب 💌', 'أنتِ مو بس صديقة، أنتِ غيمة حب تمطر على قلبي سعادة.. كل يوم وياج هو عيد! ❤️')">
                <div class="btn-icon">💌</div>
                <div class="btn-text">
                    <h3>رسائل حب وكذا</h3>
                    <p>كلام من القلب لأجمل قلب</p>
                </div>
            </div>

            <div class="cute-btn" onclick="openBox('وعد أفلان 💍', 'وعدي لج أن أبقى دائماً الشخص اللي يسعدج، ونبقى سوى لأخر يوم بالعمر! 🌸')">
                <div class="btn-icon">✨</div>
                <div class="btn-text">
                    <h3>وعد للأبد</h3>
                    <p>عن مستقبلنا سوى</p>
                </div>
            </div>

        </div>

        <div class="music-bar">
            <button class="play-pause" onclick="togglePlay()" id="playBtn">▶</button>
            <div style="flex-grow: 1;">
                <p style="font-size: 0.8rem; font-weight: bold;">أغنية أفلانة المفضلة 🎵</p>
                <div style="height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin-top: 5px;">
                    <div id="prog" style="height: 100%; width: 0%; background: white;"></div>
                </div>
            </div>
        </div>

    </div>

    <div id="overlay" onclick="closeBox()">
        <div class="modal" onclick="event.stopPropagation()">
            <h2 id="m-title" style="color: var(--dark-pink); margin-bottom: 15px;"></h2>
            <p id="m-body" style="line-height: 1.6; color: #555;"></p>
            <button onclick="closeBox()" style="margin-top: 20px; padding: 10px 25px; border-radius: 20px; border: none; background: var(--dark-pink); color: white; font-weight: bold;">إغلاق 🌸</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="your_song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // محرك القلوب المتساقطة
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            hearts = [];
            for(let i=0; i<30; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    s: Math.random() * 15 + 10,
                    v: Math.random() * 1.5 + 0.5
                });
            }
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "#ffb3d9";
            hearts.forEach(h => {
                ctx.font = h.s + "px serif";
                ctx.fillText("🌸", h.x, h.y);
                h.y += h.v;
                if(h.y > canvas.height) h.y = -20;
            });
            requestAnimationFrame(draw);
        }

        // التحكم في الأزرار والرسائل
        function openBox(t, b) {
            document.getElementById('m-title').innerText = t;
            document.getElementById('m-body').innerText = b;
            document.getElementById('overlay').style.display = 'flex';
        }

        function closeBox() { document.getElementById('overlay').style.display = 'none'; }

        // المشغل الموسيقي
        const audio = document.getElementById('bg-music');
        function togglePlay() {
            const btn = document.getElementById('playBtn');
            if(audio.paused) { audio.play(); btn.innerText = "⏸"; }
            else { audio.pause(); btn.innerText = "▶"; }
        }

        audio.ontimeupdate = () => {
            const p = (audio.currentTime / audio.duration) * 100;
            document.getElementById('prog').style.width = p + "%";
        };

        // تفاعل الأرنوب عند الضغط
        document.getElementById('bunny').onclick = function() {
            this.style.transform = "scale(1.5)";
            document.getElementById('msg').innerText = "يا روحي أنتي! 💖";
            setTimeout(() => { 
                this.style.transform = "scale(1)"; 
                document.getElementById('msg').innerText = "أحبج حيل! ✨";
            }, 500);
        };

        window.onload = () => { init(); draw(); };
        window.onresize = init;
    </script>
</body>
</html>
