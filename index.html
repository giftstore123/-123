<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مملكة أفلانة الأبدية 🌸✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --p-dark: #ff4d94;
            --p-main: #ffb3d9;
            --glass: rgba(255, 255, 255, 0.88);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; user-select: none; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #fff0f5; }

        /* شاشة الدخول */
        #splash {
            position: fixed; inset: 0; z-index: 10000; background: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* الحاوية الرئيسية */
        .app-shell {
            height: 100%; width: 100%; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #fff 0%, #ffe4e1 100%);
            opacity: 0; transition: 1.5s ease-in;
        }

        .main-card {
            width: 92%; max-width: 450px; height: 90%; max-height: 800px;
            background: var(--glass); backdrop-filter: blur(25px);
            border: 5px solid white; border-radius: 50px;
            display: flex; flex-direction: column; padding: 20px; gap: 15px;
            box-shadow: 0 30px 60px rgba(255, 179, 217, 0.5);
            position: relative; z-index: 10;
        }

        /* منطقة الفيديو بدلاً من الأرنب */
        .video-container {
            flex: 1; position: relative; border-radius: 30px; overflow: hidden;
            border: 3px solid var(--p-main); background: #000;
            box-shadow: 0 0 20px var(--p-main);
        }
        #main-video { width: 100%; height: 100%; object-fit: cover; }

        /* أزرار المشاعر */
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .pink-btn {
            background: white; border: 2px solid var(--p-main); padding: 15px;
            border-radius: 20px; display: flex; align-items: center; gap: 15px;
            cursor: pointer; box-shadow: 0 5px 0 var(--p-main); transition: 0.2s;
        }
        .pink-btn:active { transform: translateY(5px); box-shadow: none; }
        .icon-circle { width: 40px; height: 40px; background: #fff0f5; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }

        /* تأثيرات اللمس */
        .particle { position: fixed; pointer-events: none; z-index: 9999; animation: flyOut 1s forwards; }
        @keyframes flyOut { to { transform: translate(var(--x), var(--y)) rotate(360deg); opacity: 0; } }

        /* مشغل الموسيقى المخفي */
        .mini-player { background: var(--p-dark); padding: 12px; border-radius: 25px; color: white; display: flex; align-items: center; gap: 10px; }
        
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 11000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .msg-box { width: 85%; background: white; padding: 30px; border-radius: 35px; text-align: center; border: 4px solid var(--p-main); }
    </style>
</head>
<body onclick="spawnFlower(event)">

    <div id="splash">
        <h1 style="color: var(--p-dark); margin-bottom: 20px;">لأغلى إنسانة.. أفلانة 🌸</h1>
        <button onclick="unlock()" style="padding: 15px 40px; border-radius: 30px; border: none; background: var(--p-dark); color: white; font-weight: bold; cursor: pointer; font-size: 1.2rem;">إفتحي الهدية ✨</button>
    </div>

    <div class="app-shell" id="app">
        <div class="main-card">
            <header style="text-align: center;">
                <h2 style="color: var(--p-dark); font-size: 1.2rem;">أنتِ قطعة من الجنة ☁️</h2>
            </header>

            <div class="video-container">
                <video id="main-video" loop playsinline>
                    <source src="video.mp4" type="video/mp4">
                    متصفحك لا يدعم الفيديو.
                </video>
            </div>

            <div class="btn-group">
                <div class="pink-btn" onclick="openP('تاريخ الصدفة 📅', 'بيوم [12/10] تغيرت حياتي.. الصدفة اللي جابتج لدنيتي هي أعظم نعمة. أحبج حيل! ❤️')">
                    <div class="icon-circle">📅</div>
                    <div><h3 style="color: var(--p-dark); font-size: 0.9rem;">أجمل صدفة</h3><p style="font-size: 0.7rem; color: #888;">متى نورتي حياتي؟</p></div>
                </div>
                <div class="pink-btn" onclick="openP('وعد للأبد 💍', 'أوعدج يا أفلانة إني أكون لج السند والضحكة والأمان.. ما أترك إيدج أبد! 🌸')">
                    <div class="icon-circle">✨</div>
                    <div><h3 style="color: var(--p-dark); font-size: 0.9rem;">وعد أفلان</h3><p style="font-size: 0.7rem; color: #888;">عهدي الج طول العمر</p></div>
                </div>
            </div>

            <div class="mini-player">
                <span>🎵</span>
                <div style="flex:1; height:4px; background:rgba(255,255,255,0.3); border-radius:2px; position:relative;">
                    <div id="progress" style="position:absolute; height:100%; background:white; width:0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" onclick="this.style.display='none'">
        <div class="msg-box">
            <h2 id="mT" style="color: var(--p-dark); margin-bottom: 15px;"></h2>
            <p id="mB" style="color: #555; line-height: 1.6;"></p>
        </div>
    </div>

    <audio id="bg-audio" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <script>
        // فتح الموقع وتشغيل الموسيقى والفيديو
        function unlock() {
            document.getElementById('bg-audio').play();
            document.getElementById('main-video').play();
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.opacity = '1';
                // انفجار الورود الأول
                confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 }, colors: ['#ffb3d9', '#ff4d94'] });
            }, 1000);
        }

        // نظام الورود عند اللمس 🌸
        function spawnFlower(e) {
            const flowers = ['🌸', '💖', '✨', '🌹', '🍬'];
            for(let i=0; i<5; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.innerText = flowers[Math.floor(Math.random()*flowers.length)];
                el.style.left = e.clientX + 'px';
                el.style.top = e.clientY + 'px';
                el.style.fontSize = Math.random()*20 + 10 + 'px';
                
                // اتجاهات عشوائية
                const x = (Math.random() - 0.5) * 200;
                const y = (Math.random() - 0.5) * 200;
                el.style.setProperty('--x', x + 'px');
                el.style.setProperty('--y', y + 'px');
                
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            }
        }

        function openP(t, b) {
            document.getElementById('mT').innerText = t;
            document.getElementById('mB').innerText = b;
            document.getElementById('modal').style.display = 'flex';
            confetti({ particleCount: 50, colors: ['#ff4d94'] });
        }

        const audio = document.getElementById('bg-audio');
        audio.ontimeupdate = () => {
            document.getElementById('progress').style.width = (audio.currentTime/audio.duration*100) + "%";
        };
    </script>
</body>
</html>
