<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردة أفلانة ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-color: radial-gradient(ellipse at bottom, #ff4d8d, #d81b60, #880e4f);
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background: #05050a;
            font-family: 'Tajawal', sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* حاوية الوردة - نظام التمركز المطلق */
        .flower-system {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            display: flex; justify-content: center; align-items: center;
        }

        .center-circle {
            position: absolute; width: 80px; height: 80px;
            background: radial-gradient(circle, #ffca28, #f57f17);
            border-radius: 50%; z-index: 100;
            box-shadow: 0 0 40px rgba(255, 193, 7, 0.8);
            transform: translate(-50%, -50%); /* تمركز حقيقي */
            top: 0; left: 0;
        }

        .green-stem {
            position: absolute; width: 14px; height: 350px;
            background: linear-gradient(to bottom, #1b5e20, #388e3c, #051006);
            top: 0; left: -7px; /* نصف عرض الساق لتتمركز */
            border-radius: 20px; z-index: 1;
        }

        .petal {
            position: absolute;
            width: 130px; height: 180px;
            background: var(--p-color);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            transform-origin: bottom center;
            /* تبدأ من نقطة الصفر بالضبط */
            bottom: 0; 
            left: -65px; /* نصف عرض الورقة لتتمركز */
            cursor: pointer;
            z-index: 50;
            box-shadow: 2px 5px 25px rgba(0,0,0,0.7);
            transition: transform 0.4s ease, opacity 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* نافذة الرسائل */
        #modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.95);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; backdrop-filter: blur(15px);
        }

        .modal-content {
            width: 85%; max-width: 320px; height: 480px;
            background: var(--p-color);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            display: flex; justify-content: center; align-items: center;
            padding: 30px; text-align: center; color: white;
            font-size: 1.8rem; font-weight: bold;
            box-shadow: 0 0 60px #d81b60;
            animation: zoomIn 0.4s ease-out;
        }

        @keyframes zoomIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* السحابة 🌧 */
        #cloud {
            position: absolute; bottom: 30px; right: 30px;
            font-size: 80px; cursor: grab; z-index: 500;
            filter: drop-shadow(0 0 15px white);
            user-select: none;
        }

        .drop {
            position: absolute; color: #4fc3f7; font-size: 20px;
            animation: fall 0.6s linear infinite;
            pointer-events: none; z-index: 400;
        }

        @keyframes fall { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(100px); opacity: 0; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="modal" onclick="this.style.display='none'">
    <div class="modal-content" id="modal-text"></div>
</div>

<div id="cloud">🌧</div>

<div class="flower-system" id="flower-center-point">
    <div class="green-stem"></div>
    <div id="petals-container"></div>
    <div class="center-circle"></div>
</div>

<script>
    const msgs = [
        "أنتِ النور في عتمتي ❤️",
        "جمالكِ يغلب الورد 🌹",
        "أفلانة.. ملكة قلبي 👑",
        "ضحكتكِ هي لحني المفضل 🎵",
        "كل يوم معكِ هو عيد ✨",
        "أعشقكِ بجنون يا نجمتي 🌟",
        "بُستاني لا يزهر إلا بكِ ❤️"
    ];

    let plucked = 0;
    const cloud = document.getElementById('cloud');

    function createFlower() {
        const container = document.getElementById('petals-container');
        container.innerHTML = '';
        plucked = 0;
        for (let i = 0; i < 7; i++) {
            const p = document.createElement('div');
            p.className = 'petal';
            const rotate = i * (360 / 7);
            p.style.transform = `rotate(${rotate}deg)`;
            
            p.onclick = (e) => {
                e.stopPropagation();
                document.getElementById('modal-text').innerText = msgs[i];
                document.getElementById('modal').style.display = 'flex';
                p.classList.add('hidden');
                plucked++;
            };
            container.appendChild(p);
        }
    }

    // سحب السحابة
    let dragging = false;
    cloud.onmousedown = cloud.ontouchstart = (e) => { dragging = true; };
    window.onmouseup = window.ontouchend = () => dragging = false;

    window.onmousemove = window.ontouchmove = (e) => {
        if (!dragging) return;
        const x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const y = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        
        cloud.style.position = 'fixed';
        cloud.style.left = (x - 40) + 'px';
        cloud.style.top = (y - 40) + 'px';
        cloud.style.right = 'auto'; cloud.style.bottom = 'auto';

        const d = document.createElement('div');
        d.className = 'drop'; d.innerHTML = '💧';
        d.style.left = x + 'px'; d.style.top = (y + 40) + 'px';
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 600);

        const target = document.getElementById('flower-center-point').getBoundingClientRect();
        const dist = Math.sqrt(Math.pow(x - target.left, 2) + Math.pow(y - target.top, 2));
        
        if (dist < 100 && plucked === 7) createFlower();
    };

    window.onload = createFlower;
</script>
</body>
</html>
