<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حديقة أفلانة الموسيقية 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-main: #ff1262; --p-dark: #7a0932;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0; background: linear-gradient(135deg, #a5d6f7, #fce4ec);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Tajawal', sans-serif; overflow: hidden;
        }

        /* حاوية الوردة - SVG لضمان الدقة */
        .flower-box {
            position: relative; width: 350px; height: 500px;
            display: flex; justify-content: center; align-items: center;
        }

        svg { width: 100%; height: 100%; overflow: visible; }

        /* تصميم الورقة كمسار SVG */
        .petal {
            fill: url(#petalGradient);
            stroke: rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.5s, opacity 0.5s;
            transform-box: fill-box;
            transform-origin: bottom center;
        }

        .petal:hover { filter: brightness(1.1); }

        /* مشغل الموسيقى الزجاجي */
        .player {
            position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 340px; background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px); border-radius: 30px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3);
            text-align: center; transition: bottom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        .player.active { bottom: 30px; }

        /* نافذة الرسالة */
        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-card {
            width: 280px; padding: 30px; background: var(--p-main);
            border-radius: 30px; color: white; text-align: center;
        }

        #cloud { position: fixed; top: 20px; right: 20px; font-size: 70px; cursor: grab; z-index: 500; }
        .hidden { opacity: 0; pointer-events: none; transform: scale(0) !important; }
    </style>
</head>
<body>

    <div id="cloud">🌧</div>

    <div class="flower-box">
        <svg viewBox="0 0 200 400">
            <defs>
                <linearGradient id="stemGradient" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#1b5e20" />
                    <stop offset="50%" stop-color="#388e3c" />
                    <stop offset="100%" stop-color="#1b5e20" />
                </linearGradient>
                <radialGradient id="petalGradient" cx="50%" cy="100%" r="100%">
                    <stop offset="0%" stop-color="#ff4d8d" />
                    <stop offset="100%" stop-color="#7a0932" />
                </radialGradient>
            </defs>
            
            <rect x="95" y="150" width="10" height="250" rx="5" fill="url(#stemGradient)" />
            
            <g id="petals-group"></g>
            
            <circle cx="100" cy="150" r="35" fill="#fbc02d" stroke="#f57f17" stroke-width="2" />
        </svg>
    </div>

    <div id="modal" onclick="this.style.display='none'">
        <div class="modal-card">
            <h2 id="modal-text"></h2>
            <button id="gift-btn" style="display:none; margin-top:15px; padding:10px 20px; border-radius:20px; border:none; font-weight:bold;" onclick="showPlayer()">افتحي الهدية الموسيقية 🎵</button>
        </div>
    </div>

    <div class="player" id="music-player">
        <h3>لحن الحب لأفلانة ❤️</h3>
        <button onclick="toggleMusic()" style="width:60px; height:60px; border-radius:50%; border:none; background:var(--p-main); color:white; font-size:24px;">▶</button>
        <audio id="audio" loop><source src="your_song.mp3" type="audio/mpeg"></audio>
    </div>

    <script>
        const msgs = ["نور عيني ❤️", "جميلة كوردة 🌹", "ملكة قلبي 👑", "لحني المفضل 🎵", "عيدي الدائم ✨", "نجمتي اللامعة 🌟", "أحبكِ جداً ❤️"];
        let plucked = 0;
        const group = document.getElementById('petals-group');

        function drawFlower() {
            group.innerHTML = '';
            plucked = 0;
            document.getElementById('music-player').classList.remove('active');
            for(let i=0; i<7; i++) {
                const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                // رسم بتلة احترافية
                p.setAttribute("d", "M100,150 Q130,50 100,20 Q70,50 100,150");
                p.setAttribute("class", "petal");
                p.style.transform = `rotate(${i * (360/7)}deg)`;
                
                p.onclick = () => {
                    document.getElementById('modal-text').innerText = msgs[i];
                    document.getElementById('modal').style.display = 'flex';
                    p.classList.add('hidden');
                    plucked++;
                    if(plucked === 7) document.getElementById('gift-btn').style.display = 'inline-block';
                };
                group.appendChild(p);
            }
        }

        function showPlayer() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('music-player').classList.add('active');
        }

        function toggleMusic() {
            const a = document.getElementById('audio');
            a.paused ? a.play() : a.pause();
        }

        // السحابة للسقي
        let drag = false;
        const cloud = document.getElementById('cloud');
        cloud.onmousedown = cloud.ontouchstart = () => drag = true;
        window.onmouseup = window.ontouchend = () => drag = false;
        window.onmousemove = window.ontouchmove = (e) => {
            if(!drag) return;
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            cloud.style.left = x - 35 + 'px'; cloud.style.top = y - 35 + 'px';
            if(Math.abs(x - window.innerWidth/2) < 50 && plucked === 7) drawFlower();
        }

        drawFlower();
    </script>
</body>
</html>
