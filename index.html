<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رحلة أفلان وأفلانة الكونية ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-bg: #0a0a2a;
            --star-gold: #ffdf00;
            --neon-pink: #ff007f;
            --neon-blue: #00f2ff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 0;
            background: var(--space-bg);
            height: 100vh; width: 100vw;
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            color: white;
        }

        /* خلفية الفضاء المتحركة */
        #universe {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            z-index: -1;
        }

        /* الصاروخ */
        .rocket {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            z-index: 100;
            transition: all 2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .rocket-launch { bottom: 120vh; filter: blur(2px); }

        /* النجوم التفاعلية */
        .star-msg {
            position: absolute;
            cursor: pointer;
            font-size: 30px;
            filter: drop-shadow(0 0 10px var(--star-gold));
            transition: transform 0.3s, opacity 0.5s;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.5; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* مشغل الموسيقى الفضائي */
        .space-player {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90%; max-width: 350px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 2px solid var(--neon-blue);
            border-radius: 25px; padding: 30px;
            text-align: center; z-index: 2000;
            transition: all 0.8s ease;
        }

        .player-show { transform: translate(-50%, -50%) scale(1); }

        .disk {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 4px solid var(--neon-pink);
            margin: 0 auto 20px;
            background: url('https://cdn-icons-png.flaticon.com/512/1384/1384061.png') center/cover;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* نافذة الرسائل */
        #space-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 3000;
        }

        .nebula-card {
            padding: 40px; background: linear-gradient(45deg, #4b0082, #00008b);
            border-radius: 20px; border: 2px solid var(--star-gold);
            text-align: center; max-width: 80%;
            box-shadow: 0 0 30px var(--star-gold);
        }

        .btn-launch {
            margin-top: 20px; padding: 10px 20px;
            background: var(--neon-pink); color: white;
            border: none; border-radius: 10px; font-weight: bold;
            display: none; cursor: pointer;
        }

        .planet { position: absolute; border-radius: 50%; opacity: 0.6; z-index: -1; }
    </style>
</head>
<body>

    <div id="universe"></div>

    <div class="planet" style="width: 100px; height: 100px; background: #ff5722; top: 10%; left: 10%; box-shadow: 0 0 20px #ff5722;"></div>
    <div class="planet" style="width: 60px; height: 60px; background: #03a9f4; bottom: 20%; right: 15%; box-shadow: 0 0 20px #03a9f4;"></div>

    <div id="stars-container"></div>

    <div class="rocket" id="myRocket">🚀</div>

    <div id="space-modal" onclick="closeModal()">
        <div class="nebula-card">
            <h2 id="msg-content"></h2>
            <button class="btn-launch" id="launchBtn" onclick="launchSequence()">انطلاق الرحلة الموسيقية 🚀🎵</button>
            <p id="hint" style="font-size: 12px; margin-top: 10px; opacity: 0.7;">(اضغطي للإغلاق)</p>
        </div>
    </div>

    <div class="space-player" id="musicPlayer">
        <div class="disk" id="disk"></div>
        <h3 style="color: var(--neon-blue);">راديو المحطة الفضائية ❤️</h3>
        <p>لحن أفلان وأفلانة</p>
        <button onclick="toggleMusic()" style="background: var(--neon-pink); border: none; color: white; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; cursor: pointer;">▶</button>
        <audio id="audio" loop><source src="your_song.mp3" type="audio/mpeg"></audio>
    </div>

    <script>
        const msgs = [
            "تاريخ تعارفنا هو بداية كوني ❤️",
            "أنتِ النجمة التي تضيء سمائي 🌟",
            "رحلتنا مستمرة للأبد يا ملكتي 👑",
            "كل مجرة في الكون تشهد بحبي لكِ 🌌",
            "أنتِ الكوكب الذي أريد الاستقرار فيه 🪐",
            "ضحكتكِ هي صوت النجوم 🎵",
            "أحبكِ بعدد نجوم هذا الكون ❤️"
        ];

        let starsClicked = 0;
        const starsContainer = document.getElementById('stars-container');

        // 1. إنشاء النجوم في أماكن عشوائية
        function createUniverse() {
            starsContainer.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const s = document.createElement('div');
                s.className = 'star-msg';
                s.innerHTML = '⭐';
                s.style.left = Math.random() * 80 + 10 + '%';
                s.style.top = Math.random() * 60 + 10 + '%';
                s.style.animationDelay = Math.random() * 2 + 's';
                
                s.onclick = (e) => {
                    e.stopPropagation();
                    openStar(i, s);
                };
                starsContainer.appendChild(s);
            }
        }

        function openStar(index, el) {
            document.getElementById('msg-content').innerText = msgs[index];
            document.getElementById('space-modal').style.display = 'flex';
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            starsClicked++;

            if (starsClicked === 7) {
                document.getElementById('launchBtn').style.display = 'inline-block';
                document.getElementById('hint').style.display = 'none';
            }
        }

        function closeModal() {
            if (starsClicked < 7) {
                document.getElementById('space-modal').style.display = 'none';
            }
        }

        // 2. تتابع الانطلاق
        function launchSequence() {
            document.getElementById('space-modal').style.display = 'none';
            const r = document.getElementById('myRocket');
            r.classList.add('rocket-launch');
            
            setTimeout(() => {
                document.getElementById('musicPlayer').classList.add('player-show');
            }, 1500);
        }

        // 3. مشغل الموسيقى
        const track = document.getElementById('audio');
        function toggleMusic() {
            const disk = document.getElementById('disk');
            if (track.paused) {
                track.play();
                disk.style.animationPlayState = 'running';
            } else {
                track.pause();
                disk.style.animationPlayState = 'paused';
            }
        }

        window.onload = createUniverse;
    </script>
</body>
</html>
