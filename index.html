<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أفلان & أفلانة: رحلة النجوم الأبدية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. إعدادات النظام المتقدمة */
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007f;
            --space-dark: #05050a;
            --star-gold: #ffdf00;
            --glass-white: rgba(255, 255, 255, 0.1);
            --border-glow: rgba(0, 242, 255, 0.3);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }

        body {
            background: var(--space-dark);
            height: 100vh; width: 100vw;
            font-family: 'Tajawal', sans-serif;
            color: white; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* 2. محرك الخلفية الفضائية (Starfield Canvas) */
        #space-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
        }

        /* 3. الإطار الرئيسي (The Command Center) */
        .dashboard {
            position: relative; width: 95%; max-width: 1100px; height: 90vh;
            background: rgba(10, 10, 25, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 40px; z-index: 10;
            box-shadow: 0 0 100px rgba(0, 242, 255, 0.1), inset 0 0 50px rgba(0,0,0,0.5);
            padding: 30px; display: grid;
            grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto;
            gap: 20px;
        }

        /* 4. قسم الصاروخ والرسائل (Flight Path) */
        .flight-section {
            grid-column: 1 / 2; grid-row: 1 / 3;
            position: relative; display: flex; flex-direction: column; justify-content: center;
        }

        .rocket-container {
            position: absolute; left: 20px; top: 50px;
            animation: floatingRocket 4s infinite ease-in-out;
        }

        .rocket-icon { font-size: 80px; display: block; filter: drop-shadow(0 0 15px var(--neon-pink)); }
        
        .path-visualizer {
            margin-top: 150px; padding-left: 20px;
            display: flex; flex-direction: column; gap: 30px;
        }

        .waypoint {
            display: flex; align-items: center; gap: 15px;
            cursor: pointer; transition: 0.4s; opacity: 0.6;
        }

        .waypoint.active { opacity: 1; transform: scale(1.1); }

        .waypoint-icon {
            width: 50px; height: 50px; border-radius: 50%;
            border: 2px solid var(--neon-blue);
            display: flex; justify-content: center; align-items: center;
            background: rgba(0, 242, 255, 0.1); font-size: 20px;
        }

        /* 5. لوحة معلومات التاريخ (Mission Clock) */
        .mission-info {
            grid-column: 2 / 3; grid-row: 1 / 2;
            background: var(--glass-white); border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px; text-align: center;
        }

        .date-display {
            font-family: 'Orbitron', sans-serif; font-size: 2.5rem;
            color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink);
            margin-bottom: 10px;
        }

        .mission-label { letter-spacing: 5px; opacity: 0.8; font-size: 0.9rem; }

        /* 6. قسم الأزرار الجانبية (Quick Access) */
        .actions-section {
            grid-column: 2 / 3; grid-row: 2 / 3;
            display: flex; flex-direction: column; gap: 15px; justify-content: center;
        }

        .btn-sci-fi {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--neon-blue);
            padding: 20px; border-radius: 15px;
            display: flex; align-items: center; gap: 15px;
            cursor: pointer; transition: 0.3s; overflow: hidden;
            position: relative;
        }

        .btn-sci-fi::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .btn-sci-fi:hover::after { left: 100%; }
        .btn-sci-fi:hover { background: rgba(0, 242, 255, 0.2); transform: translateX(-10px); }

        /* 7. مشغل الأغاني الاحترافي (Sonic Engine) */
        .sonic-player {
            grid-column: 1 / 3; grid-row: 3 / 4;
            background: rgba(255,255,255,0.05); border-radius: 30px;
            padding: 20px; display: flex; align-items: center; gap: 25px;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        .disk-animator {
            width: 70px; height: 70px; border-radius: 50%;
            border: 3px solid var(--neon-pink);
            background: radial-gradient(circle, #333, #000);
            display: flex; justify-content: center; align-items: center;
            animation: spinDisk 3s linear infinite;
            animation-play-state: paused;
        }

        .player-info { flex-grow: 1; }
        .progress-track {
            height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin-top: 10px; position: relative;
        }
        .progress-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            background: var(--neon-blue); width: 0%; box-shadow: 0 0 10px var(--neon-blue);
        }

        /* 8. نافذة الرسائل الكونية (Message HUD) */
        #hud-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000; display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(15px);
        }

        .hud-content {
            width: 85%; max-width: 500px; padding: 40px;
            border: 2px solid var(--neon-blue); border-radius: 30px;
            background: rgba(10, 20, 40, 0.8); text-align: center;
            box-shadow: 0 0 50px var(--neon-blue);
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes floatingRocket {
            0%, 100% { transform: translateY(0) rotate(-45deg); }
            50% { transform: translateY(-30px) rotate(-40deg); }
        }

        @keyframes spinDisk { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @keyframes slideUp { 0% { transform: translateY(50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <div class="dashboard">
        
        <div class="flight-section">
            <div class="rocket-container">
                <span class="rocket-icon">🚀</span>
                <p style="margin-top: 10px; font-weight: bold; color: var(--neon-pink);">أفلان & أفلانة</p>
            </div>

            <div class="path-visualizer" id="waypoints">
                </div>
        </div>

        <div class="mission-info">
            <div class="mission-label">تاريخ البداية السعيد</div>
            <div class="date-display" id="main-date">12.10.2023</div>
            <p>يوم سقطت فيه نجمة من السماء لتستقر في قلبي</p>
        </div>

        <div class="actions-section">
            <div class="btn-sci-fi" onclick="showHud('رسائل الحب', 'كل حرف هنا كتبه قلبي قبل عقلي.. أنتِ الأغلى.')">
                <span>📧</span>
                <div>
                    <strong>قاعدة البيانات</strong>
                    <div style="font-size: 0.7rem; opacity: 0.7;">رسائل الحب المؤرشفة</div>
                </div>
            </div>
            
            <div class="btn-sci-fi" onclick="showHud('مستقبلنا', 'نحو مجرات جديدة معاً.. يد بـ يد للأبد.')">
                <span>🪐</span>
                <div>
                    <strong>استكشاف الكوكب</strong>
                    <div style="font-size: 0.7rem; opacity: 0.7;">رؤية مستقبلنا المشترك</div>
                </div>
            </div>
        </div>

        <div class="sonic-player">
            <div class="disk-animator" id="disk">💿</div>
            <div class="player-info">
                <div style="font-weight: bold;">أغنية النجوم المفضلة 🎵</div>
                <div class="progress-track">
                    <div class="progress-fill" id="p-bar"></div>
                </div>
            </div>
            <button onclick="toggleAudio()" style="background: var(--neon-pink); border: none; width: 50px; height: 50px; border-radius: 50%; color: white; cursor: pointer; font-size: 20px;">▶</button>
        </div>

    </div>

    <div id="hud-overlay" onclick="this.style.display='none'">
        <div class="hud-content">
            <h2 id="hud-title" style="color: var(--neon-blue); margin-bottom: 20px;"></h2>
            <p id="hud-body" style="font-size: 1.3rem; line-height: 1.6;"></p>
            <div style="margin-top: 30px; font-size: 0.8rem; opacity: 0.5;">[ انقري في أي مكان للعودة للمحطة ]</div>
        </div>
    </div>

    <audio id="bg-track" loop>
        <source src="your_song.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* --- محرك النجوم (Canvas Engine) --- */
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    z: Math.random() * canvas.width,
                    o: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                let x = (s.x - canvas.width/2) * (canvas.width/s.z) + canvas.width/2;
                let y = (s.y - canvas.height/2) * (canvas.width/s.z) + canvas.height/2;
                let size = (1 - s.z/canvas.width) * 3;
                ctx.globalAlpha = 1 - s.z/canvas.width;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI*2);
                ctx.fill();
                s.z -= 2;
                if(s.z <= 0) s.z = canvas.width;
            });
            requestAnimationFrame(drawStars);
        }

        /* --- نظام خريطة الرحلة --- */
        const waypointsData = [
            "أول لقاء بيننا ✨",
            "ضحكتكِ التي غيرت كوني 🎵",
            "وعدي لكِ بالأمان ❤️",
            "أنتِ النور في عتمتي 🌟",
            "ملكة قلبي للأبد 👑"
        ];

        function buildPath() {
            const container = document.getElementById('waypoints');
            waypointsData.forEach((text, i) => {
                const div = document.createElement('div');
                div.className = 'waypoint active';
                div.innerHTML = `
                    <div class="waypoint-icon">⭐</div>
                    <div>${text}</div>
                `;
                div.onclick = (e) => {
                    e.stopPropagation();
                    showHud("محطة رقم " + (i+1), text);
                };
                container.appendChild(div);
            });
        }

        /* --- نظام HUD والموسيقى --- */
        function showHud(title, body) {
            document.getElementById('hud-title').innerText = title;
            document.getElementById('hud-body').innerText = body;
            document.getElementById('hud-overlay').style.display = 'flex';
        }

        const track = document.getElementById('bg-track');
        function toggleAudio() {
            const disk = document.getElementById('disk');
            if(track.paused) {
                track.play();
                disk.style.animationPlayState = 'running';
            } else {
                track.pause();
                disk.style.animationPlayState = 'paused';
            }
        }

        track.ontimeupdate = () => {
            const bar = document.getElementById('p-bar');
            bar.style.width = (track.currentTime / track.duration * 100) + "%";
        };

        /* --- تشغيل النظام --- */
        window.addEventListener('resize', initStars);
        initStars();
        drawStars();
        buildPath();

    </script>
</body>
</html>
