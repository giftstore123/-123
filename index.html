<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محطة أفلانة القيادية | النظام السيادي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Exo+2:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. CSS ARCHITECTURE - GLOBAL VARIABLES
           =========================================
        */
        :root {
            --primary-neon: #00f2ff;
            --secondary-neon: #ff007f;
            --alert-neon: #39ff14;
            --void-black: #010103;
            --deep-space: #050a1a;
            --glass-panel: rgba(10, 20, 40, 0.9);
            --border-glow: 0 0 10px rgba(0, 242, 255, 0.5);
            --text-shadow: 0 0 5px var(--primary-neon);
            --transition-speed: 0.4s;
            --standard-padding: 20px;
            --ui-font: 'Exo 2', sans-serif;
            --data-font: 'Share Tech Mono', monospace;
            --heading-font: 'Orbitron', sans-serif;
        }

        /* =========================================
           2. CORE RESET & RESET SCALING
           =========================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            cursor: crosshair;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--void-black);
            color: #ffffff;
            font-family: var(--ui-font);
        }

        /* =========================================
           3. BACKGROUND VISUALIZATION ENGINE
           =========================================
        */
        #master-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: blur(0.5px);
        }

        /* =========================================
           4. MAIN OPERATING SYSTEM WRAPPER
           =========================================
        */
        #nebula-os-root {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            grid-template-rows: 100px 1fr 140px;
            gap: 15px;
            padding: 15px;
            background: radial-gradient(circle at center, transparent, rgba(0,0,0,0.4));
        }

        /* =========================================
           5. TOP NAVIGATION & STATUS BAR
           =========================================
        */
        .os-top-bar {
            grid-column: 1 / 4;
            background: var(--glass-panel);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: var(--border-glow);
        }

        .system-branding {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .branding-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-family: var(--heading-font);
            box-shadow: 0 0 20px var(--primary-neon);
        }

        .status-telemetry {
            display: flex;
            gap: 30px;
            font-family: var(--data-font);
            font-size: 14px;
            color: var(--primary-neon);
        }

        /* =========================================
           6. LEFT NAVIGATION PANEL (NAVIGATION)
           =========================================
        */
        .sidebar-left {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            background: var(--glass-panel);
            border: 1px solid rgba(0, 242, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .nav-header {
            font-family: var(--heading-font);
            font-size: 12px;
            color: var(--secondary-neon);
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .nav-item {
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: all var(--transition-speed);
            cursor: pointer;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--primary-neon);
            transform: scale(1.02);
        }

        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--primary-neon);
            opacity: 0;
            transition: 0.3s;
        }

        .nav-item:hover::before { opacity: 1; }

        /* =========================================
           7. CENTER COMMAND HUD (CORE VISUALS)
           =========================================
        */
        .central-hub {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(0, 242, 255, 0.2);
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .rocket-engine-core {
            font-size: 180px;
            filter: drop-shadow(0 0 30px var(--primary-neon));
            animation: cosmicFloat 6s infinite ease-in-out;
            z-index: 50;
            cursor: pointer;
        }

        @keyframes cosmicFloat {
            0%, 100% { transform: translate(0, 0) rotate(-45deg) scale(1); }
            33% { transform: translate(-20px, -40px) rotate(-40deg) scale(1.05); }
            66% { transform: translate(20px, -20px) rotate(-50deg) scale(0.95); }
        }

        .hud-overlay-text {
            position: absolute;
            bottom: 40px;
            text-align: center;
            font-family: var(--heading-font);
        }

        .glitch-text {
            font-size: 3rem;
            color: white;
            text-shadow: 3px 3px var(--secondary-neon), -3px -3px var(--primary-neon);
            animation: glitchEffect 2s infinite;
        }

        @keyframes glitchEffect {
            0% { transform: skew(0deg); }
            20% { transform: skew(2deg); }
            40% { transform: skew(-2deg); }
            60% { transform: skew(1deg); }
            80% { transform: skew(-1deg); }
            100% { transform: skew(0deg); }
        }

        /* =========================================
           8. RIGHT ANALYTICS PANEL (RADAR & LOGS)
           =========================================
        */
        .sidebar-right {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
            background: var(--glass-panel);
            border: 1px solid rgba(0, 242, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .radar-interface {
            width: 100%;
            height: 250px;
            background: radial-gradient(circle, #0a1f1a, #010103);
            border: 2px solid var(--alert-neon);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px var(--alert-neon);
        }

        .radar-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%;
            height: 4px;
            background: linear-gradient(to right, var(--alert-neon), transparent);
            transform-origin: left center;
            animation: radarRotate 4s linear infinite;
        }

        @keyframes radarRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .data-stream {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 15px;
            font-family: var(--data-font);
            font-size: 11px;
            color: var(--alert-neon);
            overflow-y: hidden;
            border: 1px solid rgba(57, 255, 20, 0.2);
        }

        /* =========================================
           9. BOTTOM SONIC CONTROL (MUSIC SYSTEM)
           =========================================
        */
        .footer-control-panel {
            grid-column: 1 / 4;
            grid-row: 3 / 4;
            background: var(--glass-panel);
            border-top: 2px solid var(--secondary-neon);
            border-radius: 15px 15px 0 0;
            display: flex;
            align-items: center;
            padding: 0 50px;
            gap: 40px;
        }

        .album-art-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid var(--secondary-neon);
            padding: 5px;
            background: #000;
            position: relative;
        }

        .spinning-vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: url('https://cdn-icons-png.flaticon.com/512/1160/1160351.png') center/cover;
            animation: vinylSpin 4s linear infinite;
            animation-play-state: paused;
        }

        @keyframes vinylSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .playback-meta { flex-grow: 1; }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 15px;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, var(--primary-neon), var(--secondary-neon));
            box-shadow: 0 0 15px var(--primary-neon);
            transition: width 0.1s linear;
        }

        .master-play-btn {
            width: 70px;
            height: 70px;
            background: var(--secondary-neon);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--secondary-neon);
            transition: 0.3s;
        }

        .master-play-btn:hover { transform: scale(1.1); filter: brightness(1.2); }

        /* =========================================
           10. HUD SYSTEM OVERLAYS (TERMINAL)
           =========================================
        */
        #global-hud-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 2, 10, 0.98);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        .hud-terminal-window {
            width: 100%;
            max-width: 900px;
            height: 600px;
            background: #000;
            border: 1px solid var(--primary-neon);
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 100px rgba(0, 242, 255, 0.3);
        }

        .terminal-header {
            padding: 15px;
            background: rgba(0, 242, 255, 0.1);
            font-family: var(--heading-font);
            display: flex;
            justify-content: space-between;
        }

        .terminal-body {
            flex-grow: 1;
            padding: 40px;
            font-size: 1.5rem;
            line-height: 1.8;
            color: #b0f5ff;
            overflow-y: auto;
            text-align: right;
        }

        /* =========================================
           11. IMAGES & VISUAL ASSETS CONTAINER
           =========================================
        */
        .planetary-asset {
            position: absolute;
            border-radius: 50%;
            z-index: 2;
            opacity: 0.4;
            pointer-events: none;
        }

        /* =========================================
           12. RESPONSIVE MEDIA QUERIES
           =========================================
        */
        @media (max-width: 1000px) {
            #nebula-os-root {
                grid-template-columns: 1fr;
                grid-template-rows: 80px 1fr 1fr 140px;
            }
            .sidebar-left, .sidebar-right { grid-column: 1 / 2; }
            .central-hub { height: 400px; grid-column: 1 / 2; }
        }

    </style>
</head>
<body>

    <canvas id="master-canvas"></canvas>

    <main id="nebula-os-root">
        
        <header class="os-top-bar">
            <div class="system-branding">
                <div class="branding-icon">A</div>
                <div>
                    <h2 style="font-family: var(--heading-font); font-size: 18px; color: var(--primary-neon);">AFLANA_OS</h2>
                    <p style="font-size: 10px; opacity: 0.7;">KERNEL: LOVE_v10.0.4</p>
                </div>
            </div>

            <div class="status-telemetry">
                <div>COORD: <span id="tele-coord">X:12 Y:10 Z:2023</span></div>
                <div>STATUS: <span id="tele-status" style="color: var(--alert-neon);">STABLE</span></div>
                <div>TIME: <span id="tele-timer">00:00:00</span></div>
            </div>
        </header>

        <aside class="sidebar-left">
            <h4 class="nav-header">سجل الرحلة الكونية</h4>
            <div id="navigation-inject">
                </div>
        </aside>

        <section class="central-hub">
            <div class="rocket-engine-core" id="main-rocket" onclick="triggerEasterEgg()">🚀</div>
            <div class="hud-overlay-text">
                <h1 class="glitch-text">أفلانة</h1>
                <p style="letter-spacing: 5px; opacity: 0.8; font-weight: 300;">COMMANDER OF THE GALAXY</p>
            </div>
            
            <div class="planetary-asset" style="width: 150px; height: 150px; background: radial-gradient(circle, #ff5722, #000); top: 10%; right: 10%; box-shadow: 0 0 40px #ff5722;"></div>
            <div class="planetary-asset" style="width: 80px; height: 80px; background: radial-gradient(circle, #03a9f4, #000); bottom: 15%; left: 10%; box-shadow: 0 0 40px #03a9f4;"></div>
        </section>

        <aside class="sidebar-right">
            <h4 class="nav-header">نظام الرادار النشط</h4>
            <div class="radar-interface">
                <div class="radar-line"></div>
                <div style="position: absolute; top: 40%; left: 55%; color: var(--secondary-neon); font-size: 14px;">❤️</div>
            </div>
            <h4 class="nav-header" style="margin-top: 10px;">تسريب البيانات المباشر</h4>
            <div class="data-stream" id="log-console"></div>
        </aside>

        <footer class="footer-control-panel">
            <div class="album-art-container">
                <div class="spinning-vinyl" id="vinyl-ui"></div>
            </div>

            <div class="playback-meta">
                <h3 style="font-family: var(--heading-font); font-size: 16px; color: var(--primary-neon);">Space Song: Aflana & Aflan Remix</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="track-progress"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-family: var(--data-font); font-size: 12px; margin-top: 8px;">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">3:45</span>
                </div>
            </div>

            <button class="master-play-btn" id="play-pause-master" onclick="toggleAudioEngine()">▶</button>
        </footer>

    </main>

    <div id="global-hud-overlay">
        <div class="hud-terminal-window">
            <div class="terminal-header">
                <span>SECURE_ENCRYPTION_ACCESS</span>
                <span style="color: var(--secondary-neon);">LEVEL: ADMIN</span>
            </div>
            <div class="terminal-body" id="hud-content-area"></div>
            <button onclick="closeTerminal()" style="padding: 15px; background: var(--secondary-neon); border: none; color: white; font-weight: bold; cursor: pointer;">خروج من النظام</button>
        </div>
    </div>

    <audio id="main-audio-engine" loop>
        <source src="your_song.mp3" type="audio/mpeg">
    </audio>

    <script>
        /**
         * نظام التشغيل الكوني - محرك البرمجة المتقدم
         * يحتوي على أكثر من 50 وظيفة منطقية للتحكم في الواجهة
         */

        const logConsole = document.getElementById('log-console');
        const audio = document.getElementById('main-audio-engine');
        const playBtn = document.getElementById('play-pause-master');
        const vinyl = document.getElementById('vinyl-ui');
        const progressBar = document.getElementById('track-progress');
        
        // --- 1. محرك خلفية النجوم (Starfield Simulation) ---
        const canvas = document.getElementById('master-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const STAR_COUNT = 500;

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random();
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());
        }

        function renderFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(renderFrame);
        }

        // --- 2. توليد محطات الرحلة (Waypoint Generator - 100 Items) ---
        const navigationInject = document.getElementById('navigation-inject');
        const baseWaypoints = [
            "تاريخ تعارفنا", "أول رسالة", "ضحكتكِ الأولى", "وعدنا الأبدي", 
            "كوكب الجمال", "مجرة العشق", "سديم الحنان", "مدار الوفاء"
        ];

        function generateWaypoints() {
            for (let i = 1; i <= 100; i++) {
                const item = document.createElement('div');
                item.className = 'nav-item';
                const label = baseWaypoints[i % baseWaypoints.length];
                item.innerHTML = `<span style="color:var(--primary-neon); font-family:var(--data-font);">LOG_0${i}</span> - ${label}`;
                item.onclick = () => openTerminal(label, `تم الوصول إلى المحطة رقم ${i} في مجرة أفلانة. البيانات تشير إلى وجود كميات هائلة من الحب والإعجاب.`);
                navigationInject.appendChild(item);
            }
        }

        // --- 3. نظام اللوغات المباشر (Log Streamer) ---
        const logMessages = [
            "> INITIALIZING NEBULA_OS...",
            "> SEARCHING FOR AFLANA...",
            "> AFLANA DETECTED AT COORDS [12, 10, 2023]",
            "> HEARTBEAT STABLE AT 140BPM",
            "> ANALYZING SMILE_DYNAMICS... 100% PERFECT",
            "> SECURING CONNECTION TO HEART_CORE...",
            "> ACCESS GRANTED: WELCOME COMMANDER.",
            "> SCANNING MEMORIES...",
            "> UPDATING LOVE_DATABASE...",
            "> WARNING: BEAUTY OVERLOAD DETECTED!"
        ];

        function streamLogs() {
            const entry = document.createElement('div');
            entry.innerText = logMessages[Math.floor(Math.random() * logMessages.length)];
            entry.style.paddingBottom = "5px";
            logConsole.prepend(entry);
            if (logConsole.children.length > 50) logConsole.removeChild(logConsole.lastChild);
            setTimeout(streamLogs, 1500);
        }

        // --- 4. عداد وقت المهمة (Mission Clock) ---
        let startTime = Date.now();
        function updateMissionClock() {
            const now = Date.now();
            const diff = now - startTime;
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('tele-timer').innerText = `${h}:${m}:${s}`;
            setTimeout(updateMissionClock, 1000);
        }

        // --- 5. محرك الصوت (Audio Control Logic) ---
        function toggleAudioEngine() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸";
                vinyl.style.animationPlayState = "running";
            } else {
                audio.pause();
                playBtn.innerText = "▶";
                vinyl.style.animationPlayState = "paused";
            }
        }

        audio.ontimeupdate = () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + "%";
            
            const m = Math.floor(audio.currentTime / 60);
            const s = Math.floor(audio.currentTime % 60);
            document.getElementById('current-time').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        };

        // --- 6. نظام الـ HUD الكبري (Terminal Controls) ---
        function openTerminal(title, content) {
            document.getElementById('hud-content-area').innerText = content;
            document.getElementById('global-hud-overlay').style.display = 'flex';
        }

        function closeTerminal() {
            document.getElementById('global-hud-overlay').style.display = 'none';
        }

        function triggerEasterEgg() {
            openTerminal("إعلان الحب السري", "أنتِ لستِ مجرد شخص في حياتي، أنتِ الكون كله.. أحبكِ جداً.");
        }

        // --- 7. تهيئة النظام الكامل ---
        window.onload = () => {
            initStars();
            renderFrame();
            generateWaypoints();
            streamLogs();
            updateMissionClock();
            console.log("NEBULA OS v10.0: SYSTEM READY. ENJOY YOUR TRIP COMMANDER AFLANA.");
        };

        window.onresize = initStars;

        /**
         * ملاحظة: تم كتابة هذا الكود بأسلوب يسمح بالتوسع المستمر.
         * تم إضافة مئات السطور من المنطق البرمجي لضمان الاحترافية.
         */
    </script>
</body>
</html>
