<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردة أفلانة ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --petal-color: radial-gradient(ellipse at bottom, #ff4d8d, #d81b60, #880e4f);
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background: #05050a;
            font-family: 'Tajawal', sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* حاوية الوردة الثابتة */
        .flower-area {
            position: relative;
            width: 200px; height: 200px;
            display: flex; justify-content: center; align-items: center;
        }

        .flower-center {
            position: absolute; width: 70px; height: 70px;
            background: radial-gradient(circle, #ffca28, #f57f17);
            border-radius: 50%; z-index: 25;
            box-shadow: 0 0 30px rgba(255, 193, 7, 0.6);
        }

        .stem {
            position: absolute; width: 14px; height: 280px;
            background: linear-gradient(to bottom, #1b5e20, #388e3c, #0a240d);
            top: 100px; border-radius: 20px; z-index: 1;
        }

        /* ضبط البتلات لتكون ملتصقة بالمركز */
        .petal {
            position: absolute;
            width: 120px; height: 170px;
            background: var(--petal-color);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            /* نقطة الدوران من أسفل المنتصف تماماً */
            transform-origin: bottom center;
            /* تبدأ من مستوى قلب الوردة */
            bottom: 50%; 
            cursor: pointer;
            z-index: 10;
            box-shadow: 2px 5px 20px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 0.5px solid rgba(255,255,255,0.1);
        }

        /* نافذة الرسالة الكبيرة */
        #petal-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; backdrop-filter: blur(12px);
        }

        .modal-petal {
            width: 320px; height: 480px;
            background: var(--petal-color);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            display: flex; justify-content: center; align-items: center;
            padding: 35px; text-align: center; color: white;
            font-size: 1.8rem; font-weight: bold;
            box-shadow: 0 0 60px #d81b60;
            animation: zoomIn 0.5s ease-out;
            line-height: 1.5;
        }

        @keyframes zoomIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* السحابة 🌧 */
        #cloud {
            position: absolute; bottom: 30px; right: 30px;
            font-size: 90px; cursor: grab; z-index: 500;
            filter: drop-shadow(0 0 15px white);
            user-select: none; transition: transform 0.1s;
        }

        .rain {
            position: absolute; color: #4fc3f7; font-size: 25px;
            animation: rainFall 0.6s linear infinite;
            pointer-events: none; z-index: 400;
        }

        @keyframes rainFall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(120px); opacity: 0; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="petal-modal" onclick="this.style.display='none'">
    <div class="modal-petal" id="modal-text"></div>
</div>

<div id="cloud">🌧</div>

<div class="flower-area" id="flower-target">
    <div class="flower-center"></div>
    <div id="petals-container"></div>
    <div class="stem"></div>
</div>

<script>
    const msgs = [
        "أنتِ النور في عتمتي ❤️",
        "جمالكِ يغلب الورد 🌹",
        "أفلانة.. ملكة قلبي 👑",
        "ضحكتكِ هي لحني المفضل 🎵",
        "كل يوم معكِ هو عيد ✨",
        "أعشقكِ بجنون يا نجمتي 🌟",
        "بُستاني لا يزهر إلا بكِ ❤️"
    ];

    let pluckedCount = 0;
    const cloud = document.getElementById('cloud');

    function createFlower() {
        const container = document.getElementById('petals-container');
        container.innerHTML = '';
        pluckedCount = 0;
        for (let i = 0; i < 7; i++) {
            const p = document.createElement('div');
            p.className = 'petal';
            const rotate = i * (360 / 7);
            // الدوران من أسفل لجعلهم يلتقون في قلب الوردة
            p.style.transform = `rotate(${rotate}deg)`;
            
            p.onclick = (e) => {
                e.stopPropagation();
                document.getElementById('modal-text').innerText = msgs[i];
                document.getElementById('petal-modal').style.display = 'flex';
                p.classList.add('hidden');
                pluckedCount++;
            };
            container.appendChild(p);
        }
    }

    // نظام سحب السحابة
    let dragging = false;
    cloud.onmousedown = cloud.ontouchstart = (e) => { dragging = true; e.preventDefault(); };
    window.onmouseup = window.ontouchend = () => dragging = false;

    window.onmousemove = window.ontouchmove = (e) => {
        if (!dragging) return;
        const x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const y = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        
        cloud.style.position = 'fixed';
        cloud.style.left = (x - 45) + 'px';
        cloud.style.top = (y - 45) + 'px';

        // تأثير المطر
        const drop = document.createElement('div');
        drop.className = 'rain'; drop.innerHTML = '💧';
        drop.style.left = x + 'px'; drop.style.top = (y + 40) + 'px';
        document.body.appendChild(drop);
        setTimeout(() => drop.remove(), 600);

        // فحص السقي
        const target = document.getElementById('flower-target').getBoundingClientRect();
        const dist = Math.sqrt(Math.pow(x - (target.left + target.width/2), 2) + Math.pow(y - (target.top + target.height/2), 2));
        
        if (dist < 100 && pluckedCount === 7) {
            createFlower();
        }
    };

    window.onload = createFlower;
</script>
</body>
</html>
