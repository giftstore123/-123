<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حديقة أفلانة السحرية 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --petal-pink: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            --stem-green: linear-gradient(to bottom, #2d5a27, #1e3c1a);
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background: radial-gradient(circle, #fff5f7 0%, #ffe4e9 100%);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden; touch-action: none;
        }

        .garden {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        /* تعليمات علوية */
        #top-info {
            position: absolute; top: 30px; text-align: center;
            color: #d81b60; font-weight: bold; font-size: 1.2rem;
            z-index: 20; width: 100%;
        }

        /* منطقة الوردة */
        .flower-area {
            position: relative; width: 300px; height: 400px;
            display: flex; justify-content: center; align-items: center;
        }

        .flower-center {
            position: absolute; width: 60px; height: 60px;
            background: radial-gradient(circle, #ffeb3b, #fbc02d);
            border-radius: 50%; z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .stem {
            position: absolute; width: 12px; height: 250px;
            background: var(--stem-green);
            top: 200px; border-radius: 10px; z-index: 1;
        }

        /* البتلات (الأوراق) */
        .petal {
            position: absolute; width: 80px; height: 120px;
            background: var(--petal-pink);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            transform-origin: bottom center;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            padding: 10px; text-align: center;
            font-size: 0.8rem; font-weight: bold; color: #880e4f;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            transition: transform 0.5s ease;
            z-index: 5;
            user-select: none;
        }

        /* نص مخفي داخل الورقة */
        .petal span { opacity: 0; transition: opacity 0.3s; pointer-events: none; }

        /* أنيميشن السقوط */
        .fallen {
            position: fixed !important;
            animation: fallAnimation 2s forwards ease-in-out;
            pointer-events: none;
            z-index: 100;
        }

        .fallen span { opacity: 1 !important; font-size: 1rem; }

        @keyframes fallAnimation {
            0% { transform: translate(0, 0) rotate(var(--r)); }
            30% { transform: translate(20px, 100px) rotate(90deg); }
            60% { transform: translate(-20px, 300px) rotate(180deg); }
            100% { transform: translate(0, 500px) rotate(220deg); opacity: 0; }
        }

        /* المرشة (أداة السقي) */
        #watering-can {
            position: absolute; bottom: 40px; right: 40px;
            font-size: 60px; cursor: grab; z-index: 50;
            user-select: none; transition: transform 0.1s;
        }

        /* رذاذ الماء */
        #water-drops {
            position: absolute; display: none;
            pointer-events: none; z-index: 45;
            color: #4fc3f7; font-size: 20px;
        }

        .droplet {
            position: absolute; animation: dropRain 0.5s linear infinite;
        }

        @keyframes dropRain {
            0% { transform: translateY(0) opacity(1); }
            100% { transform: translateY(50px) opacity(0); }
        }
    </style>
</head>
<body>

<div class="garden" id="garden">
    <div id="top-info">اقطفي أوراق وردتكِ يا أفلانة.. 🌹</div>
    
    <div class="flower-area" id="flower-target">
        <div class="flower-center"></div>
        <div id="petals-container"></div>
        <div class="stem"></div>
    </div>

    <div id="watering-can">🚿</div>
    <div id="water-drops">💧<br>💧<br>💧</div>
</div>

<script>
    const messages = [
        "أنتِ نجمتي الساطعة 🌟",
        "قلبي ينبض بكِ ❤️",
        "أجمل وردة بالكون 🌹",
        "أعشق ضحكتكِ 🤭",
        "دائماً في بالي 💭",
        "حبي لكِ لا ينتهي ♾️",
        "أنتِ عالمي كله 🌍"
    ];

    let pluckedCount = 0;
    const petalsContainer = document.getElementById('petals-container');
    const can = document.getElementById('watering-can');
    const drops = document.getElementById('water-drops');
    const flowerTarget = document.getElementById('flower-target');

    function initFlower() {
        petalsContainer.innerHTML = '';
        pluckedCount = 0;
        document.getElementById('top-info').innerText = "اقطفي أوراق وردتكِ يا أفلانة.. 🌹";
        
        for (let i = 0; i < 7; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            const angle = (i * 51.4);
            petal.style.transform = `rotate(${angle}deg) translateY(-60px)`;
            petal.style.setProperty('--r', `${angle}deg`);
            petal.innerHTML = `<span>${messages[i]}</span>`;
            
            petal.onclick = function() {
                if(this.classList.contains('fallen')) return;
                this.classList.add('fallen');
                pluckedCount++;
                if(pluckedCount === 7) {
                    document.getElementById('top-info').innerText = "لقد ذبلت الوردة.. اسحبي المرشة واسقيها! 🚿";
                }
            };
            petalsContainer.appendChild(petal);
        }
    }

    // نظام السحب للمرشة (Drag System)
    let isDragging = false;

    can.onmousedown = startDrag;
    can.ontouchstart = startDrag;

    function startDrag(e) {
        isDragging = true;
        can.style.cursor = 'grabbing';
    }

    window.onmousemove = drag;
    window.ontouchmove = drag;

    function drag(e) {
        if (!isDragging) return;
        
        let x = e.clientX || e.touches[0].clientX;
        let y = e.clientY || e.touches[0].clientY;

        can.style.left = (x - 30) + 'px';
        can.style.top = (y - 30) + 'px';
        can.style.bottom = 'auto';
        can.style.right = 'auto';

        // التحقق من القرب من الوردة للسقي
        const canRect = can.getBoundingClientRect();
        const targetRect = flowerTarget.getBoundingClientRect();

        if (
            Math.abs(canRect.left - targetRect.left) < 150 &&
            Math.abs(canRect.top - targetRect.top) < 150
        ) {
            drops.style.display = 'block';
            drops.style.left = (canRect.left) + 'px';
            drops.style.top = (canRect.top + 50) + 'px';
            
            if(pluckedCount === 7) {
                setTimeout(() => {
                    initFlower(); // إعادة نمو الوردة
                }, 1000);
            }
        } else {
            drops.style.display = 'none';
        }
    }

    window.onmouseup = stopDrag;
    window.ontouchend = stopDrag;

    function stopDrag() {
        isDragging = false;
        can.style.cursor = 'grab';
        drops.style.display = 'none';
    }

    window.onload = initFlower;
</script>
</body>
</html>
