<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مملكة أفلانة السحرية 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --p-light: #fff5f8;
            --p-main: #ffb3d9;
            --p-dark: #ff4d94;
            --glass: rgba(255, 255, 255, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html { height: 100%; width: 100%; overflow: hidden; background: linear-gradient(135deg, #fff0f5 0%, #e6f7ff 100%); }

        /* شاشة الدخول السحرية */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 0.8s ease-in-out;
        }

        .enter-btn {
            padding: 20px 50px; font-size: 1.5rem; font-weight: 900;
            background: var(--p-dark); color: white; border: none;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 77, 148, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* التصميم الرئيسي للموقع */
        .main-container {
            height: 100%; width: 100%; display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: 1s; transform: scale(0.9);
        }

        .card {
            width: 90%; max-width: 450px; height: 85%; max-height: 750px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 4px solid white; border-radius: 45px;
            display: flex; flex-direction: column; padding: 25px; gap: 15px;
            position: relative; z-index: 10;
            box-shadow: 0 25px 50px rgba(255, 179, 217, 0.4);
        }

        .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .character { font-size: 110px; animation: float 3s infinite ease-in-out; cursor: pointer; filter: drop-shadow(0 10px 20px rgba(255, 77, 148, 0.2)); }
        
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-20px) rotate(5deg); } }

        .bubble {
            background: white; padding: 12px 25px; border-radius: 25px;
            color: var(--p-dark); font-weight: 900; font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-top: 10px;
        }

        /* الأزرار الاحترافية */
        .btn-stack { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            background: white; border: 2px solid var(--p-main);
            padding: 16px; border-radius: 22px; display: flex; align-items: center; gap: 15px;
            cursor: pointer; box-shadow: 0 5px 0 var(--p-main); transition: 0.2s;
            position: relative; overflow: hidden;
        }

        /* تأثير اللمعان على الأزرار */
        .btn::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: rotate(45deg); transition: 0.5s; opacity: 0;
        }
        .btn:hover::after { left: 100%; opacity: 1; }
        .btn:active { transform: translateY(5px); box-shadow: none; }

        .icon-box { min-width: 45px; height: 45px; background: var(--p-light); border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        .info h3 { font-size: 1rem; color: var(--p-dark); }
        .info p { font-size: 0.75rem; color: #888; }

        /* شريط الموسيقى */
        .music-player {
            background: var(--p-dark); padding: 15px; border-radius: 30px;
            display: flex; align-items: center; gap: 15px; color: white;
        }

        /* المودال (الرسائل) */
        #modal-overlay { position: fixed; inset: 0; background: rgba(255, 179, 217, 0.85); z-index: 1000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-box { width: 85%; max-width: 380px; background: white; padding: 35px; border-radius: 40px; text-align: center; border: 5px solid var(--p-main); }
        
        canvas#bg-stars { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h2 style="color: var(--p-dark); margin-bottom: 20px;">جاهزة للمفاجأة؟ ✨</h2>
        <button class="enter-btn" onclick="startMagic()">دخول المملكة 🌸</button>
    </div>

    <canvas id="bg-stars"></canvas>

    <div class="main-container" id="main-ui">
        <div class="card">
            <header style="text-align: center; border-bottom: 2px dashed var(--p-main); padding-bottom: 10px;">
                <h1 style="color: var(--p-dark); font-size: 1.4rem;">🌸 مملكة أفلانة السحرية 🌸</h1>
            </header>

            <div class="hero">
                <div class="character" id="bunny" onclick="bunnyTalk()">🐰</div>
                <div class="bubble" id="talk">أهلاً يا أميرتي! ✨</div>
            </div>

            <div class="btn-stack">
                <div class="btn" onclick="openMsg('تاريخ الصدفة 📅', 'في هذا التاريخ [12/10/2023]، بدأت أجمل صدفة في حياتي، اليوم اللي صار فيه كل شي وردي بوجودج! 💖')">
                    <div class="icon-box">📅</div>
                    <div class="info"><h3>تاريخ الصدفة الحلوة</h3><p>متى بدأت الحكاية؟</p></div>
                </div>
                <div class="btn" onclick="openMsg('رسائل حب وكذا 💌', 'أنتِ مو بس صديقة، أنتِ غيمة حب تمطر على قلبي سعادة.. كل يوم وياج هو عيد! ❤️')">
                    <div class="icon-box">💌</div>
                    <div class="info"><h3>رسائل من القلب</h3><p>كلام لأغلى إنسانة</p></div>
                </div>
                <div class="btn" onclick="openMsg('وعد أفلان 💍', 'وعدي لج أن نكبر سوياً، ونبقى دائماً السند لبعضنا.. إيدج بإيدي للأبد! 🌸')">
                    <div class="icon-box">✨</div>
                    <div class="info"><h3>وعد للأبد</h3><p>عهدي لج طول العمر</p></div>
                </div>
            </div>

            <div class="music-player">
                <div style="font-size: 20px;">🎵</div>
                <div style="flex: 1;">
                    <p style="font-size: 0.8rem; font-weight: bold;">أغنية أفلانة 🌸</p>
                    <div style="height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin-top: 5px;">
                        <div id="prog-bar" style="width: 0%; height: 100%; background: white;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" onclick="closeMsg()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h2 id="m-title" style="color: var(--p-dark); margin-bottom: 15px;"></h2>
            <p id="m-body" style="color: #666; line-height: 1.6; font-size: 1.1rem;"></p>
            <button onclick="closeMsg()" style="margin-top: 25px; padding: 12px 35px; border-radius: 20px; border: none; background: var(--p-dark); color: white; font-weight: bold; cursor: pointer;">إغلاق 🌸</button>
        </div>
    </div>

    <audio id="bg-audio" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // وظيفة بدء السحر (تشغيل الموسيقى والانتقال)
        function startMagic() {
            const audio = document.getElementById('bg-audio');
            audio.play(); // الموسيقى ستبدأ فوراً هنا

            // إخفاء شاشة الدخول وإظهار الموقع
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('main-ui').style.opacity = '1';
                document.getElementById('main-ui').style.transform = 'scale(1)';
                
                // انفجار القلوب الترحيبي
                fireConfetti();
            }, 800);
        }

        function fireConfetti() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ffb3d9', '#ff4d94', '#ffffff']
            });
        }

        // محرك الخلفية
        const canvas = document.getElementById('bg-stars');
        const ctx = canvas.getContext('2d');
        let parts = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            parts = [];
            for(let i=0; i<40; i++) parts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*15+5, v: Math.random()*1+0.5});
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 77, 148, 0.4)";
            parts.forEach(p => {
                ctx.font = p.s + "px serif";
                ctx.fillText("🌸", p.x, p.y);
                p.y += p.v;
                if(p.y > canvas.height) p.y = -20;
            });
            requestAnimationFrame(draw);
        }

        // التحكم بالرسائل
        function openMsg(t, b) {
            document.getElementById('m-title').innerText = t;
            document.getElementById('m-body').innerText = b;
            document.getElementById('modal-overlay').style.display = 'flex';
            fireConfetti(); // انفجار قلوب عند كل رسالة
        }
        function closeMsg() { document.getElementById('modal-overlay').style.display = 'none'; }

        // شريط الموسيقى
        const track = document.getElementById('bg-audio');
        track.ontimeupdate = () => {
            const p = (track.currentTime / track.duration) * 100;
            document.getElementById('prog-bar').style.width = p + "%";
        };

        function bunnyTalk() {
            const b = document.getElementById('bunny');
            const t = document.getElementById('talk');
            b.style.transform = "scale(1.4) rotate(15deg)";
            t.innerText = "فديتج يا أحلى بنوتة! ❤️";
            setTimeout(() => { b.style.transform = "scale(1)"; }, 500);
        }

        window.onload = () => { init(); draw(); };
        window.onresize = init;
    </script>
</body>
</html>
